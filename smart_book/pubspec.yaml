name: smart_book
description: "A new Flutter project for Accounting Management."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.10.7 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  get_it: ^7.7.0
  shared_preferences: ^2.3.0
  modal_progress_hud_nsn: ^0.5.1

  equatable: ^2.0.7
  data_table_2: ^2.5.15

  # PDF & Printing
  pdf: ^3.10.8
  printing: ^5.11.1
  share_plus: ^7.2.1

  # Icons
  cupertino_icons: ^1.0.8

  # State Management
  flutter_bloc: ^8.1.6

  # API
  http: ^1.2.0
  flutter_secure_storage: ^9.0.0

  # Formatting
  intl: ^0.20.2

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1

  # Localization
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  generate: true

  assets:
    - assets/images/